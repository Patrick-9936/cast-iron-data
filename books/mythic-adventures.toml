[[books]]
source = "mythic-adventures"
title = "Mythic Adventures"
basis = "The chapter titles, their order, and their first pages are checked against the printed contents page of Mythic Adventures. The Introduction and Glossary are front matter in print, so they are placed first in printed order. Each chapter holds its printed section headings, and each entry sits in its printed section in page order. See docs/research/book-order-evidence.md. Canonical ids were substituted through the reviewed alias map; chapters and order are unchanged."
review = ["The printed chapter 7: Fire Over Blackcrag has no corresponding chapter in the dataset.", "The 269 mythic spell records are not part of the library (see coverage).", "Nested placement follows the printed section headings; entries that share a printed page keep the dataset order.", "Canonical ids were substituted through sources/canonical/id-map.toml. A legacy entry with no installed target is omitted and listed in coverage."]


[[resolution]]
id = "ref/arcaneschool/divination"
name = "Forewarned (Su)"
occurrence = 1
span_sha256 = "14c94fb0463279e48e09dc311220e641178e4a1346b5f10b04b8b26db8cdb321"
print = "Core Rulebook p. 80"
replacement = '''
**Forewarned (Su)**

**Gained:** At 1st Level

**Passive:** You can always act in the surprise round even if you fail to make a Perception roll to
notice a foe, but you are still considered [flat-footed](ref/rule/flat-footed) until you take an
action. In addition, you receive a bonus on initiative checks equal to 1/2 your wizard level
(minimum +1).

**At 20th level,** anytime you roll initiative, assume the roll resulted in a natural 20.
'''

[[resolution]]
id = "ref/arcaneschool/earth"
name = "Earth Supremacy (Su)"
occurrence = 1
span_sha256 = "987e873df4bd56996cc5ba098c20bc1ee1a4dd0ee8cb3d121d757aa9ddc861d7"
print = "Advanced Player's Guide p. 142"
replacement = '''
**Earth Supremacy (Su)**

**Gained:** At 1st Level

**Passive:** You gain an enhancement bonus to your CMD to resist [bull rush](ref/rule/bull-rush),
[reposition](ref/rule/reposition), [trip](ref/rule/trip), and [overrun](ref/rule/overrun) attempts
as long as you are touching the ground. This bonus is equal to 2 + one-fifth of your wizard level.
In addition, you gain a +1 insight bonus on melee attack and damage rolls whenever both you and your
foe are touching the ground.

**At 20th level,** earth and stone do not block the line of effect of your spells, although they do still block your line of sight.
'''

[[resolution]]
id = "ref/arcaneschool/necromancy"
name = "Power over Undead (Su)"
occurrence = 1
span_sha256 = "5204449e6b81e928361273549e2ed08ce1f361795b268a86ed8e4b110177a27c"
print = "Core Rulebook p. 81"
replacement = '''
**Power over Undead (Su)**

**Gained:** At 1st Level

**Standard:** You receive [Command Undead](ref/feat/command-undead) or
[Turn Undead](ref/feat/turn-undead) as a bonus feat, and you can
[channel energy](ref/ability/channel-energy), but only to use the selected feat. You can take other
feats to add to this ability, such as [Extra Channel](ref/feat/extra-channel) and
[Improved Channel](ref/feat/improved-channel), but not feats that alter this ability, such as
[Elemental Channel](ref/feat/elemental-channel) and [Alignment Channel](ref/feat/alignment-channel).
The DC to save against these feats is equal to 10 + 1/2 your wizard level + your Charisma modifier.

**Usage:** 3 + Intelligence modifier times/day

**At 20th level,** undead cannot add their [channel resistance](ref/rule/channel-resistance) to the save against this ability.
'''

[[resolution]]
id = "ref/aspect/electric-eel"
name = "Major Form"
occurrence = 1
span_sha256 = "4a0e4730ccc15b6e257345cb14b406bfb94abb81e82683382f43f12b8d39eaab"
print = "Wilderness Origins p. 4"
replacement = '''
**Major Form**

**Ability:** Your shape changes to that of an [electric eel](ref/monster/eel-electric-eel). While in
this form, you gain a swim speed of 30 feet, [low-light vision](ref/rule/low-light-vision),
electricity [resistance](ref/umr/resistance) 5, a [bite attack](ref/umr/natural-attacks) (1d6), and
a tail attack (a secondary natural touch attack that deals 1d6 points of electricity damage).

**At 8th level,** your electricity resistance increases to 10 and you gain a +4 racial bonus on Escape Artist checks.

**At 15th level,** on a critical hit with your tail attack, the creature struck must succeed at a Fortitude save (DC = 10 + half your shifter level + your Constitution modifier) or be [stunned](ref/misc/stunned) for 1d4 rounds.

**Functions As:** [Beast Shape II](ref/spell/beast-shape-2)
'''


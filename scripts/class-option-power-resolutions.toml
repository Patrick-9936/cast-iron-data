You can use _project servitor_ to summon a shadowy projection of any creature currently within your demiplane, as long as its CR matches the summon spell (CR 1/2 or lower for [summon monster I](ref/spell/summon-monster-1), CR 1 for [summon monster II](ref/spell/summon-monster-2), CR 2 for [summon monster III](ref/spell/summon-monster-3), CR 3 or 4 for [summon monster IV](ref/spell/summon-monster-4), CR 5 or 6 for [summon monster V](ref/spell/summon-monster-5), CR 7 or 8 for [summon monster VI](ref/spell/summon-monster-6), or CR 9 or 10 for [summon monster VII](ref/spell/summon-monster-7)).

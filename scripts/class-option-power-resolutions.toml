[[resolution]]
id = "ref/exploit/primal-magic"
name = "Primal Magic (Sp)"
occurrence = 1
span_sha256 = "7768b7ede32f82149a4f67c5c1f45a17df56050fc80ace499ef32174ab06d867"
print = "Arcane Anthology p. 17"
replacement = '''
**Primal Magic (Sp)**

**Ability:** The arcanist can expend 1 or more points from her arcane reservoir to create an uncontrolled primal effect. This creates an effect from the [Sample Primal Magic Events](ref/rule/primal-magic) table. The CR of this effect is equal to the arcanist's caster level, to a maximum caster level of 5 per point spent from her arcane reserve. In this case, the effect is treated as a spell with a spell level equal to half its CR (maximum spell level 9).

Alternatively, the arcanist can expend 1 point from her arcane reservoir and expend a spell slot of at least 3rd level to create an effect as if she has used a [rod of wonder](ref/magic-rod/rod-of-wonder). Any spell created by the _rod of wonder_ effect uses the arcanist's spell level, rather than the spell level set by the _rod of wonder_ table (for example a [fireball](ref/spell/fireball) created by an 8th level arcanist rolling on the _rod of wonder_ table would deal 8d6, rather than the listed 6d6). In this case, the effect is treated as a spell with a spell level equal to the spell slot expended.

**Info:** In seeking to restore formal training in magic to the world, Old-Mage Jatembe also
discovered a few methods of creating magic effects that did not follow consistent or logical rules.
While his only known remaining notes on these more chaotic forms of magic are closely guarded within
the [Magaambya](ref/rule/aff-i-school), some arcanists have either recreated his theories from vague
comments on other topics or independently rediscovered the methods Jatembe first detailed. This
"primal magic" can be accessed one of two ways.
'''


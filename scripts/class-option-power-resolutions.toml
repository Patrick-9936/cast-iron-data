[[resolution]]
id = "ref/eidolon/elemental"
name = "Base Evolutions"
occurrence = 1
span_sha256 = "035c9d5ad43268cefb8408f4ac31e410e0f5d04b9ab5b3f7414cfce4d073999e"
print = "Pathfinder Unchained p. 32"
replacement = '''
**Base Evolutions**

**Gained:** At 1st Level

**Ability:** All elemental eidolons gain immunity to paralysis and sleep. In addition, air elemental eidolons gain the [immunity](ref/unchevolution/immunity) (electricity) evolution. Earth elemental eidolons gain the _[immunity](ref/carried/bestiary/rules/universal-monster-rules/immunity)_ (acid) evolution. Fire elemental eidolons gain the _[immunity](ref/carried/bestiary/rules/universal-monster-rules/immunity)_ (fire) evolution. Water elemental eidolons gain the _[immunity](ref/carried/bestiary/rules/universal-monster-rules/immunity)_ (cold) evolution.

**At 4th level,** all elemental eidolons add 1 point to their evolution pools.

**At 8th level,** air elemental eidolons gain the [flight](ref/unchevolution/flight) evolution (using magic) with a speed equal to their base speed. Earth elemental eidolons gain the [burrow](ref/unchevolution/burrow) evolution. Fire elemental eidolons increase their base speed by 20 feet. Water elemental eidolons gain the [swim](ref/unchevolution/swim) evolution twice, gaining a swim speed equal to their base speed + 20 feet. They also gain the [gills](ref/unchevolution/gills) evolution, which allows them to breathe underwater.

**At 12th level,** all elemental eidolons gain immunity to bleed, poison, and stun. In addition, they can no longer be [flanked](ref/rule/flanking).

**At 16th level,** all elemental eidolons gain immunity to critical hits and do not take additional damage from precision-based attacks, such as sneak attack.

**At 20th level,** an air elemental eidolon gains the [whirlwind](ref/umr/whirlwind) ability, with a maximum height of 15 feet (30 feet for a Large air elemental) and dealing 1d6 points of damage (1d8 for a Large air elemental). Earth elemental eidolons gain the _earth mastery_ ability of an [earth elemental](ref/monster/earth-elemental) and DR 5/-. Fire elemental eidolons gain the [energy attacks](ref/unchevolution/energy-attacks) (fire) evolution and the [burn](ref/umr/burn) ability. Water elemental eidolons gain the _drench_ and _[vortex](ref/spell/vortex)_ abilities of a [water elemental](ref/monster/water-elemental). The _[vortex](ref/spell/vortex)_ ability works as the air elemental eidolon's _[whirlwind](ref/spell/whirlwind)_ ability (except as noted in the _[vortex](ref/spell/vortex)_ ability's description).

**Choice:** The base evolutions of an elemental eidolon depend entirely on its chosen element. When
first summoning an elemental eidolon, the summoner must select air, earth, fire, or water. Once
made, this choice cannot be changed. The eidolon gains the following evolutions and abilities, which
can vary depending on its element.
'''


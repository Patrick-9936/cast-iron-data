replacement = '''
**Base Evolutions**

**Gained:** At 1st Level

**Ability:** Genie eidolons gain the 4-point [weapon training](ref/unchevolution/weapon-training) evolution as well as the [resistance](ref/unchevolution/resistance) evolution for any one energy type.

**At 4th level,** genie eidolons gain the ability to grow in size twice per day as a **full-round action**. This grants them the [large](ref/unchevolution/large) evolution for 1 round per Hit Die they have, increases the size of their equipment for the duration, and does not stack with other size-changing effects. Genie eidolons who later purchase the _large_ evolution lose this ability, but they add 1 point to their evolution pools.

**At 8th level,** genie eidolons gain either the [flight](ref/unchevolution/flight) evolution (using magic) with a speed equal to their base speed; the [burrow](ref/unchevolution/burrow) evolution; or the [gills](ref/unchevolution/gills) evolution, plus the [swim](ref/unchevolution/swim) evolution twice, gaining a swim speed equal to their base speed + 20 feet.

**At 12th level,** genie eidolons lose the resistance evolution gained at 1st level and instead gain the [immunity](ref/unchevolution/immunity) evolution to the selected energy type. They can also cast [plane shift](ref/spell/plane-shift) as a [spell-like ability](ref/umr/spell-like-abilities) once per day (CL 12th), but only to transport willing targets to the Astral Plane, Elemental Planes, or Material Plane.

**At 16th level,** once per day as a **standard action**, genie eidolons can cast [cleanse](ref/spell/cleanse) or [greater evolution surge](ref/spell/evolution-surge-greater) (CL 16th) on themselves as a [spell-like ability](ref/umr/spell-like-abilities), but only in response to their masters' spoken wish (such as "I wish you were stronger"). The master can make such a wish as a **free action**.

